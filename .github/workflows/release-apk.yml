name: Release-APK

# Baut bei jedem Push auf main eine signierte APK für die Version aus version.js (APP_VERSION).
# Die Release entsteht erst, wenn die APK fertig und signiert ist; sie enthält die APK sofort.
# Bei erneutem Push derselben Version wird die APK in der bestehenden Release ersetzt.
# Die App prüft diese Release beim Start (release-check.js) und verlinkt die APK.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  – Keystore als Base64 (base64 -w0 carservicetracker.keystore)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS        – carservicetracker
#   ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    name: APK bauen und an die Release anhängen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus version.js lesen
        run: |
          TAG=$(grep -o "APP_VERSION = '[^']*'" version.js | grep -o "v[0-9][0-9.]*")
          test -n "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version: $TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-Build-Tools installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"

      - name: Versionsnummer in das Android-Projekt schreiben
        run: |
          N=$(echo "$TAG" | grep -o '[0-9]\+' | head -1)
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"$TAG\"/" android/app/build.gradle
          echo "versionCode $N, versionName $TAG"

      - name: Keystore schreiben
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: APK bauen (unsigniert)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK ausrichten und signieren
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/Service-Tracker-$TAG.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/Service-Tracker-$TAG.apk"

      - name: Release mit APK veröffentlichen (erst wenn die APK fertig ist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$RUNNER_TEMP/Service-Tracker-$TAG.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
